<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tap Clicker Game</title>
    <!-- Telegram WebApp Kitbabs -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh;
            padding: 20px;
            overflow: hidden;
        }
        .header {
            text-align: center;
            margin-top: 20px;
        }
        .score-container {
            font-size: 3.5rem;
            font-weight: bold;
            color: #f39c12;
            text-shadow: 0 0 15px rgba(243, 156, 18, 0.4);
        }
        .coin-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        .coin {
            width: 230px;
            height: 230px;
            background: radial-gradient(circle, #f1c40f, #d35400);
            border-radius: 50%;
            box-shadow: 0 15px 35px rgba(241, 196, 15, 0.3), inset 0 0 25px rgba(255, 255, 255, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6rem;
            transition: transform 0.05s ease;
        }
        .coin:active {
            transform: scale(0.92);
        }
        .energy-container {
            width: 100%;
            max-width: 320px;
            margin-bottom: 30px;
        }
        .energy-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #bdc3c7;
        }
        .energy-bar-bg {
            width: 100%;
            height: 16px;
            background-color: #2c3e50;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #34495e;
        }
        .energy-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #e74c3c, #f1c40f);
            border-radius: 6px;
            transition: width 0.1s linear;
        }
        /* Basanda yuxarı qalxan +1 effekti */
        .floating-text {
            position: absolute;
            font-size: 2rem;
            font-weight: bold;
            color: #2ecc71;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 8px rgba(0,0,0,0.6);
        }
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-90px) scale(1.3);
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="score-container">
            <span id="score">0</span>
        </div>
    </div>

    <div class="coin-wrapper" id="coinWrapper">
        <div class="coin" id="clickCoin">🪙</div>
    </div>

    <div class="energy-container">
        <div class="energy-info">
            <span>⚡ Enerji</span>
            <span><span id="currentEnergy">1000</span> / <span id="maxEnergy">1000</span></span>
        </div>
        <div class="energy-bar-bg">
            <div class="energy-bar-fill" id="energyFill"></div>
        </div>
    </div>

    <script>
        // Telegram WebApp-ı tam ekrana açmaq üçün
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
        }

        let score = 0;
        let maxEnergy = 1000;
        let energy = 1000;
        let energyStep = 1;

        const scoreElement = document.getElementById('score');
        const clickCoin = document.getElementById('clickCoin');
        const coinWrapper = document.getElementById('coinWrapper');
        const currentEnergyElement = document.getElementById('currentEnergy');
        const energyFill = document.getElementById('energyFill');

        // Klikləmə / Toxunma hadisəsi
        clickCoin.addEventListener('pointerdown', (e) => {
            if (energy < energyStep) return; // Enerji bitibsə basılmasın

            energy -= energyStep;
            score += 1;

            updateUI();
            showFloatingText(e);
        });

        function updateUI() {
            scoreElement.textContent = score.toLocaleString();
            currentEnergyElement.textContent = energy;
            const percentage = (energy / maxEnergy) * 100;
            energyFill.style.width = percentage + '%';
        }

        function showFloatingText(e) {
            const rect = clickCoin.getBoundingClientRect();
            // Toxunulan nöqtəni və ya mərkəzi təyin edirik
            const x = e.clientX ? e.clientX - rect.left - 20 : rect.width / 2;
            const y = e.clientY ? e.clientY - rect.top - 20 : rect.height / 2;

            const floatEl = document.createElement('div');
            floatEl.className = 'floating-text';
            floatEl.textContent = '+' + energyStep;
            floatEl.style.left = x + 'px';
            floatEl.style.top = y + 'px';

            coinWrapper.appendChild(floatEl);

            // Animasiya bitəndən sonra elementi silirik
            setTimeout(() => {
                floatEl.remove();
            }, 800);
        }

        // Hər saniyə enerji bərpası (3 vahid artır)
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 3);
                updateUI();
            }
        }, 1000);
    </script>
</body>
</html>
