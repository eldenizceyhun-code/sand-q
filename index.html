<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lada 07: Bakı Gecələri 3D</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Three.js 3D Kitabxanası -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
        }

        .hud-box {
            background: rgba(15, 20, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 18px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            font-weight: bold;
            font-size: 1.1rem;
            color: #66fcf1;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls-container {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            z-index: 10;
            pointer-events: none;
        }

        .control-group {
            pointer-events: auto;
            display: flex;
            gap: 15px;
        }

        .steering-wheel {
            width: 130px;
            height: 130px;
            border: 8px solid #c5c6c0;
            border-radius: 50%;
            position: relative;
            background: rgba(31, 40, 51, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .steering-wheel::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            background: #45a29e;
            border-radius: 50%;
        }

        .steering-wheel::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 6px;
            background: #c5c6c0;
        }

        .pedal {
            width: 65px;
            height: 110px;
            border-radius: 12px;
            background: linear-gradient(135deg, #45a29e, #1f2833);
            border: 3px solid #66fcf1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.95rem;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            touch-action: none;
            transition: transform 0.1s;
        }

        .pedal:active {
            transform: scale(0.92);
            background: #66fcf1;
            color: #0b0c10;
        }

        .gas-pedal { background: linear-gradient(135deg, #2ecc71, #27ae60); border-color: #2ecc71; }
        .brake-pedal { background: linear-gradient(135deg, #e74c3c, #c0392b); border-color: #e74c3c; }

        #gameOver {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 12, 16, 0.95);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }

        #gameOver h1 { font-size: 2.5rem; color: #e74c3c; margin-bottom: 10px; }
        #gameOver p { font-size: 1.2rem; color: #c5c6c0; margin-bottom: 25px; }

        .btn-restart {
            background: #66fcf1;
            color: #0b0c10;
            border: none;
            padding: 12px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(102, 252, 241, 0.4);
        }
    </style>
</head>
<body>

    <div class="hud">
        <div class="hud-box">🚗 Sürət: <span id="speedDisplay">0</span> km/s</div>
        <div class="hud-box">🛣️ Məsafə: <span id="distanceDisplay">0</span> m</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls-container">
        <div class="control-group">
            <div class="steering-wheel" id="steeringWheel"></div>
        </div>
        <div class="control-group">
            <div class="pedal brake-pedal" id="brakeBtn">ƏYLƏC</div>
            <div class="pedal gas-pedal" id="gasBtn">QAZ</div>
        </div>
    </div>

    <div id="gameOver">
        <h1>Qəza! 💥</h1>
        <p>Bakı küçələrində vuruşdunuz. Qət edilən məsafə: <span id="finalDistance">0</span> m</p>
        <button class="btn-restart" onclick="restartGame()">Yenidən Başla</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0c10);
        scene.fog = new THREE.FogExp2(0x0b0c10, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x66fcf1, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        const roadWidth = 14;
        const roadGeometry = new THREE.PlaneGeometry(roadWidth, 1000);
        const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x1f2833, roughness: 0.8 });
        const road = new THREE.Mesh(roadGeometry, roadMaterial);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -400;
        scene.add(road);

        for (let i = 0; i > -1000; i -= 20) {
            const lineGeo = new THREE.PlaneGeometry(0.4, 8);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.set(0, 0.02, i);
            scene.add(line);
        }

        const carGroup = new THREE.Group();

        const bodyGeo = new THREE.BoxGeometry(2.2, 0.9, 4.4);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, metalness: 0.2 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.8;
        carGroup.add(body);

        const cabinGeo = new THREE.BoxGeometry(1.8, 0.8, 2.2);
        const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
        const cabin = new THREE.Mesh(cabinGeo, cabinMat);
        cabin.position.set(0, 1.5, -0.2);
        carGroup.add(cabin);

        const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 16);
        wheelGeo.rotateZ(Math.PI / 2);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x000000 });

        const wheelPositions = [
            [-1.2, 0.4, 1.4], [1.2, 0.4, 1.4],
            [-1.2, 0.4, -1.4], [1.2, 0.4, -1.4]
        ];

        wheelPositions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.position.set(...pos);
            carGroup.add(wheel);
        });

        scene.add(carGroup);
        carGroup.position.set(0, 0, 0);

        camera.position.set(0, 4, 7);
        camera.lookAt(carGroup.position);

        let obstacles = [];
        function spawnObstacle() {
            const obsGeo = new THREE.BoxGeometry(2.1, 1.1, 4.2);
            const colors = [0xe74c3c, 0xf1c40f, 0x3498db, 0x9b59b6];
            const obsMat = new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random() * colors.length)] });
            const obstacle = new THREE.Mesh(obsGeo, obsMat);
            
            const lanes = [-4.5, 0, 4.5];
            const randomLane = lanes[Math.floor(Math.random() * lanes.length)];
            
            obstacle.position.set(randomLane, 0.8, -300);
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        let carX = 0;
        let speed = 0;
        let maxSpeed = 1.2;
        let distance = 0;
        let isGasPressed = false;
        let isBrakePressed = false;
        let steeringAngle = 0;
        let isGameOver = false;

        document.getElementById('gasBtn').addEventListener('pointerdown', () => { isGasPressed = true; });
        document.getElementById('gasBtn').addEventListener('pointerup', () => { isGasPressed = false; });
        document.getElementById('brakeBtn').addEventListener('pointerdown', () => { isBrakePressed = true; });
        document.getElementById('brakeBtn').addEventListener('pointerup', () => { isBrakePressed = false; });

        const steeringWheel = document.getElementById('steeringWheel');
        let isSteering = false;
        let startX = 0;

        steeringWheel.addEventListener('pointerdown', (e) => {
            isSteering = true;
            startX = e.clientX;
        });

        window.addEventListener('pointermove', (e) => {
            if (!isSteering) return;
            let diff = e.clientX - startX;
            steeringAngle = Math.max(-1, Math.min(1, diff / 60));
        });

        window.addEventListener('pointerup', () => {
            isSteering = false;
            steeringAngle = 0;
        });

        window.restartGame = function() {
            carX = 0;
            speed = 0;
            distance = 0;
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];
            isGameOver = false;
            document.getElementById('gameOver').style.display = 'none';
            loop();
        }

        let spawnTimer = 0;

        function loop() {
            if (isGameOver) return;

            if (isGasPressed) {
                speed = Math.min(maxSpeed, speed + 0.015);
            } else {
                speed = Math.max(0, speed - 0.01);
            }

            if (isBrakePressed) {
                speed = Math.max(0, speed - 0.03);
            }

            carX += steeringAngle * 0.12;
            carX = Math.max(-roadWidth / 2 + 1.5, Math.min(roadWidth / 2 - 1.5, carX));
            carGroup.position.x = carX;

            if (speed > 0) {
                distance += Math.round(speed * 10);
            }

            spawnTimer++;
            if (spawnTimer > 90 - speed * 40) {
                spawnObstacle();
                spawnTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].position.z += speed * 2;

                if (
                    Math.abs(carGroup.position.x - obstacles[i].position.x) < 1.8 &&
                    Math.abs(carGroup.position.z - obstacles[i].position.z) < 3.5
                ) {
                    isGameOver = true;
                    document.getElementById('finalDistance').textContent = distance;
                    document.getElementById('gameOver').style.display = 'flex';
                }

                if (obstacles[i].position.z > 10) {
                    scene.remove(obstacles[i]);
                    obstacles.splice(i, 1);
                }
            }

            camera.position.x = carX * 0.4;
            camera.lookAt(carGroup.position.x, carGroup.position.y + 1, carGroup.position.z - 2);

            document.getElementById('speedDisplay').textContent = Math.round(speed * 120);
            document.getElementById('distanceDisplay').textContent = distance;

            renderer.render(scene, camera);
            if (!isGameOver) requestAnimationFrame(loop);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        loop();
    </script>
</body>
</html>
