<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>AgilGram</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📸%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f8;--card:#fff;--tx:#16151c;--mut:#767683;--bd:#e4e4ea;--pri:#5b4bff;--red:#ef2b55;--grad:linear-gradient(45deg,#ffb100,#ff3d54 45%,#a22cff);--sh:0 1px 2px rgba(20,18,40,.05)}
body.dark{--bg:#0d0d12;--card:#17171e;--tx:#f2f2f6;--mut:#9b9bab;--bd:#2b2b36;--pri:#8b7dff;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.45;padding-top:env(safe-area-inset-top,0px)}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg{display:block}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.logo{font-family:Pacifico,cursive;font-size:26px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
.btn{background:var(--pri);color:#fff;font-weight:700;padding:8px 16px;border-radius:10px;font-size:13px;display:inline-block;text-align:center}
.btn.sec{background:var(--bd);color:var(--tx)}
.btn.danger{background:var(--red)}
.btn.sm{padding:5px 12px;font-size:12px}
.btn:disabled{opacity:.5}
.av{border-radius:50%;object-fit:cover;background:var(--bd);flex:none}
input[type=text],input[type=password],input[type=email],textarea,select{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);outline:none}
input:focus,textarea:focus{border-color:var(--pri)}
textarea{resize:vertical;min-height:80px}
