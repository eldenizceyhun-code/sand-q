<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>AgilGram</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📸%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f8;--card:#fff;--tx:#16151c;--mut:#767683;--bd:#e4e4ea;--pri:#5b4bff;--red:#ef2b55;--grad:linear-gradient(45deg,#ffb100,#ff3d54 45%,#a22cff);--sh:0 1px 2px rgba(20,18,40,.05)}
body.dark{--bg:#0d0d12;--card:#17171e;--tx:#f2f2f6;--mut:#9b9bab;--bd:#2b2b36;--pri:#8b7dff;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:60px}
@media(min-width:768px){body{padding-bottom:0}}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg{display:block}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

/* UI Elements */
.logo{font-family:Pacifico,cursive;font-size:26px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
.btn{background:var(--pri);color:#fff;font-weight:700;padding:8px 16px;border-radius:10px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;transition:opacity 0.2s}
.btn.sec{background:var(--bd);color:var(--tx)}
.btn.danger{background:var(--red)}
.btn.sm{padding:5px 12px;font-size:12px}
.btn:disabled{opacity:.5}
.av{border-radius:50%;object-fit:cover;background:var(--bd);flex:none}
.av-story{padding:2px;background:var(--grad);border-radius:50%}
.av-story img{border:2px solid var(--card)}

input[type=text],input[type=password],input[type=email],textarea,select{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);outline:none}
input:focus,textarea:focus{border-color:var(--pri)}
textarea{resize:vertical;min-height:80px}

/* Layout Header & Nav */
.header{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;height:60px}
.app-container{max-width:935px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:24px;padding:16px 0}
@media(min-width:768px){.app-container{grid-template-columns:1fr 320px;padding:24px 16px}}

/* Navigation Bar (Mobile bottom / Desktop Header) */
.nav-bottom{position:fixed;bottom:0;left:0;right:0;height:55px;background:var(--card);border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-around;z-index:100}
@media(min-width:768px){.nav-bottom{position:static;height:auto;border:0;background:transparent;gap:20px;justify-content:flex-end}}

/* Stories */
.stories-card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;box-shadow:var(--sh)}
.stories-card::-webkit-scrollbar{display:none}
.story-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;width:64px;flex:none;text-align:center}
.story-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}

/* Feed Posts */
.post{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:16px;box-shadow:var(--sh)}
.post-header{display:flex;align-items:center;justify-content:space-between;padding:12px}
.post-user{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px}
.post-img{width:100%;max-height:500px;object-fit:cover;background:var(--bd)}
.post-actions{padding:8px 12px;display:flex;align-items:center;justify-content:space-between}
.action-group{display:flex;align-items:center;gap:12px}
.post-body{padding:0 12px 12px}
.post-likes{font-weight:700;font-size:13px;margin-bottom:6px}
.post-caption{font-size:13px;margin-bottom:6px}
.post-time{font-size:11px;color:var(--mut);text-transform:uppercase}

/* Right Sidebar */
.sidebar{display:none}
@media(min-width:768px){.sidebar{display:block;position:sticky;top:84px;height:fit-content}}
.profile-mini{display:flex;align-items:center;gap:12px;margin-bottom:20px}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal.active{display:flex}
.modal-content{background:var(--card);border-radius:16px;max-width:400px;width:100%;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
</style>
</head>
<body>

  <!-- Top Header -->
  <header class="header">
    <a href="#" class="logo">AgilGram</a>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="themeToggle" title="Tema Dəyiş" style="font-size:18px">🌙</button>
      <button class="btn sm" onclick="openModal()">+ Yeni Post</button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="app-container">
    
    <!-- Left Feed Section -->
    <main>
      <!-- Stories Bar -->
      <div class="stories-card">
        <div class="story-item">
          <div class="av-story"><img src="https://i.pravatar.cc/100?img=33" class="av" width="56" height="56" alt="Hikayən"></div>
          <span>Sənin Hikayən</span>
        </div>
        <div class="story-item">
          <div class="av-story"><img src="https://i.pravatar.cc/100?img=12" class="av" width="56" height="56" alt="User"></div>
          <span>leyla_m</span>
        </div>
        <div class="story-item">
          <div class="av-story"><img src="https://i.pravatar.cc/100?img=60" class="av" width="56" height="56" alt="User"></div>
          <span>orxan_k</span>
        </div>
        <div class="story-item">
          <div class="av-story"><img src="https://i.pravatar.cc/100?img=47" class="av" width="56" height="56" alt="User"></div>
          <span>dəniz.v</span>
        </div>
        <div class="story-item">
          <div class="av-story"><img src="https://i.pravatar.cc/100?img=68" class="av" width="56" height="56" alt="User"></div>
          <span>elvin_tech</span>
        </div>
      </div>

      <!-- Feed Container -->
      <div id="feed" style="margin-top: 16px;">
        <!-- Post 1 -->
        <article class="post">
          <div class="post-header">
            <div class="post-user">
              <img src="https://i.pravatar.cc/100?img=33" class="av" width="32" height="32" alt="Aqil Quliyev">
              <span>aqil.quliyev</span>
            </div>
            <button class="btn sm sec">···</button>
          </div>
          <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&auto=format&fit=crop" class="post-img" alt="Post">
          <div class="post-actions">
            <div class="action-group">
              <button onclick="toggleLike(this)" style="font-size:20px">🤍</button>
              <button style="font-size:20px">💬</button>
              <button style="font-size:20px">✈️</button>
            </div>
            <button style="font-size:20px">🔖</button>
          </div>
          <div class="post-body">
            <div class="post-likes">124 bəyənmə</div>
            <div class="post-caption"><strong>aqil.quliyev</strong> Yaratmağa davam! Yeni dizayn interfeysi necədir? 🚀</div>
            <div class="post-time">2 saat əvvəl</div>
          </div>
        </article>
      </div>
    </main>

    <!-- Right Sidebar (Desktop) -->
    <aside class="sidebar">
      <div class="profile-mini">
        <img src="https://i.pravatar.cc/100?img=33" class="av" width="50" height="50" alt="Aqil Quliyev">
        <div>
          <div style="font-weight: 800;">aqil.quliyev</div>
          <div style="color: var(--mut); font-size: 12px;">Aqil Quliyev</div>
        </div>
      </div>
      
      <div style="display:flex; justify-between; align-items:center; margin-bottom: 12px;">
        <span style="color: var(--mut); font-weight:700; font-size:12px;">Sənin üçün təkliflər</span>
        <a href="#" style="font-weight:700; font-size:12px;">Hamısı</a>
      </div>

      <div style="display:flex; flex-direction:column; gap:12px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div style="display:flex; align-items:center; gap:8px;">
            <img src="https://i.pravatar.cc/100?img=15" class="av" width="36" height="36" alt="User">
            <div>
              <div style="font-weight: 700; font-size: 12px;">rashad_dev</div>
              <div style="color: var(--mut); font-size: 10px;">İzləyirsiniz</div>
            </div>
          </div>
          <button class="btn sm" style="padding:4px 8px;">İzlə</button>
        </div>
      </div>
    </aside>
  </div>

  <!-- Mobile Bottom Navigation -->
  <nav class="nav-bottom">
    <button style="font-size:22px">🏠</button>
    <button style="font-size:22px">🔍</button>
    <button onclick="openModal()" style="font-size:22px">➕</button>
    <button style="font-size:22px">🎬</button>
    <button style="font-size:22px">👤</button>
  </nav>

  <!-- Create Post Modal -->
  <div class="modal" id="createModal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="margin:0; font-size:16px;">Yeni Paylaşıram</h3>
        <button onclick="closeModal()" style="font-weight:bold;">✕</button>
      </div>
      <form id="postForm">
        <div style="margin-bottom:12px;">
          <input type="text" id="imgUrl" placeholder="Şəkil URL keçidini daxil edin" required>
        </div>
        <div style="margin-bottom:12px;">
          <textarea id="caption" placeholder="Açıqlama yazın..." required></textarea>
        </div>
        <button type="submit" class="w-100 btn" style="width:100%">Paylaş</button>
      </form>
    </div>
  </div>

  <script>
    // Theme Toggle
    const themeBtn = document.getElementById('themeToggle');
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      themeBtn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
    });

    // Like Toggle
    function toggleLike(btn) {
      if (btn.textContent === '🤍') {
        btn.textContent = '❤️';
      } else {
        btn.textContent = '🤍';
      }
    }

    // Modal Control
    const modal = document.getElementById('createModal');
    function openModal() { modal.classList.add('active'); }
    function closeModal() { modal.classList.remove('active'); }

    // Dynamic Post Creation
    document.getElementById('postForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const imgUrl = document.getElementById('imgUrl').value;
      const caption = document.getElementById('caption').value;

      const feed = document.getElementById('feed');
      const newPost = document.createElement('article');
      newPost.className = 'post';
      newPost.innerHTML = `
        <div class="post-header">
          <div class="post-user">
            <img src="https://i.pravatar.cc/100?img=33" class="av" width="32" height="32" alt="User">
            <span>aqil.quliyev</span>
          </div>
          <button class="btn sm sec">···</button>
        </div>
        <img src="${imgUrl}" class="post-img" alt="Post" onerror="this.src='https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=800'">
        <div class="post-actions">
          <div class="action-group">
            <button onclick="toggleLike(this)" style="font-size:20px">🤍</button>
            <button style="font-size:20px">💬</button>
            <button style="font-size:20px">✈️</button>
          </div>
          <button style="font-size:20px">🔖</button>
        </div>
        <div class="post-body">
          <div class="post-likes">0 bəyənmə</div>
          <div class="post-caption"><strong>aqil.quliyev</strong> ${caption}</div>
          <div class="post-time">İndicə</div>
        </div>
      `;

      feed.prepend(newPost);
      closeModal();
      this.reset();
    });
  </script>
</body>
</html>
