<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Xiyar Ovçusu - Telegram Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: linear-gradient(135deg, #1b2838, #0f1923);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: relative;
        }

        /* Oyun Paneli (Statistika) */
        .game-header {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 15px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Oyun Sahəsi (Canvas) */
        canvas {
            display: block;
            background: radial-gradient(circle, #22303c, #141d26);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-bottom: 4px solid #2ecc71;
        }

        /* Oyun Bitdi (Game Over) Ekranı */
        #gameOverScreen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 25, 35, 0.95);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }

        #gameOverScreen h1 {
            font-size: 2.5rem;
            color: #e74c3c;
            margin-bottom: 10px;
        }

        #gameOverScreen p {
            font-size: 1.2rem;
            color: #bdc3c7;
            margin-bottom: 25px;
        }

        .restart-btn {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
            transition: transform 0.1s;
        }

        .restart-btn:active {
            transform: scale(0.95);
        }

        /* Mobil İdarəetmə Düymələri (Aşağıda sola-sağa qaçmaq üçün) */
        .controls {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 400px;
            padding: 0 20px;
            z-index: 10;
        }

        .control-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 2rem;
            padding: 15px 0;
            border-radius: 16px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: background 0.1s;
        }

        .control-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="game-header">
        <div class="stat-item">🥒 Xiyar: <span id="score">0</span></div>
        <div class="stat-item">❤️ Can: <span id="lives">3</span></div>
    </div>

    <!-- Oyun Canvası -->
    <canvas id="gameCanvas"></canvas>

    <!-- Mobil Düymələr -->
    <div class="controls">
        <button class="control-btn" id="leftBtn">⬅️</button>
        <button class="control-btn" id="rightBtn">➡️</button>
    </div>

    <!-- Oyun Bitdi Ekranı -->
    <div id="gameOverScreen">
        <h1>Oyun Bitdi!</h1>
        <p>Topladığın xiyarlar: <span id="finalScore">0</span></p>
        <button class="restart-btn" onclick="restartGame()">Yenidən Oyna</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Canvas ölçülərini ekrana uyğunlaşdırırıq
        function resizeCanvas() {
            canvas.width = Math.min(window.innerWidth - 20, 420);
            canvas.height = window.innerHeight - 160;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let score = 0;
        let lives = 3;
        let isGameOver = false;

        // Qəhrəman (Adam)
        const player = {
            x: canvas.width / 2 - 30,
            y: canvas.height - 80,
            width: 60,
            height: 70,
            speed: 8,
            dx: 0
        };

        // Xiyarlar və Maneələr massivi
        let items = [];
        let spawnTimer = 0;

        // Klaviatura idarəetməsi (Kompüter üçün)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') player.dx = -player.speed;
            if (e.key === 'ArrowRight' || e.key === 'd') player.dx = player.speed;
        });

        window.addEventListener('keyup', (e) => {
            if ((e.key === 'ArrowLeft' || e.key === 'a') && player.dx < 0) player.dx = 0;
            if ((e.key === 'ArrowRight' || e.key === 'd') && player.dx > 0) player.dx = 0;
        });

        // Sensor / Mobil Düymə idarəetməsi
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');

        leftBtn.addEventListener('touchstart', () => { player.dx = -player.speed; });
        leftBtn.addEventListener('touchend', () => { player.dx = 0; });
        leftBtn.addEventListener('mousedown', () => { player.dx = -player.speed; });
        leftBtn.addEventListener('mouseup', () => { player.dx = 0; });

        rightBtn.addEventListener('touchstart', () => { player.dx = player.speed; });
        rightBtn.addEventListener('touchend', () => { player.dx = 0; });
        rightBtn.addEventListener('mousedown', () => { player.dx = player.speed; });
        rightBtn.addEventListener('mouseup', () => { player.dx = 0; });

        // Element yaratmaq (Xiyar və ya zəhərli tikanlı xiyar)
        function spawnItem() {
            const isBad = Math.random() < 0.25; // 25% ehtimalla zəhərli tikanlı xiyar gəlir
            items.push({
                x: Math.random() * (canvas.width - 40),
                y: -50,
                size: 35,
                speed: 3 + Math.random() * 3,
                isBad: isBad
            });
        }

        // Oyunu yenidən başlatmaq
        window.restartGame = function() {
            score = 0;
            lives = 3;
            items = [];
            isGameOver = false;
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            loop();
        }

        // Əsas Oyun Döngüsü (Game Loop)
        function update() {
            if (isGameOver) return;

            // Adamın hərəkəti (ekrandan çıxmasın deyə sərhəd qoyuruq)
            player.x += player.dx;
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Xiyar yaratma tezliyi
            spawnTimer++;
            if (spawnTimer > 40) {
                spawnItem();
                spawnTimer = 0;
            }

            // Xiyarların hərəkəti və toxunma yoxlanışı
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.speed;

                // Adamla xiyar toqquşurmu? (Collision detection)
                if (
                    player.x < item.x + item.size &&
                    player.x + player.width > item.x &&
                    player.y < item.y + item.size &&
                    player.y + player.height > item.y
                ) {
                    if (item.isBad) {
                        // Tikanlı xiyara dəydi -> Can azalır
                        lives--;
                        if (lives <= 0) {
                            isGameOver = true;
                            document.getElementById('finalScore').textContent = score;
                            document.getElementById('gameOverScreen').style.display = 'flex';
                        }
                    } else {
                        // Dadlı xiyar -> Xal artır
                        score += 10;
                    }
                    document.getElementById('score').textContent = score;
                    document.getElementById('lives').textContent = lives;
                    items.splice(i, 1);
                    continue;
                }

                // Ekrandan aşağı düşənləri silirik
                if (item.y > canvas.height) {
                    items.splice(i, 1);
                }
            }
        }

        // Çizim funksiyaları (Graphics)
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Qəhrəmanı (Adamı) çəkirik (Gülməli emoji adam)
            ctx.font = "50px Arial";
            ctx.textAlign = "center";
            ctx.fillText("🏃‍♂️", player.x + player.width / 2, player.y + 50);

            // 2. Xiyarları çəkirik
            for (let item of items) {
                ctx.font = "35px Arial";
                if (item.isBad) {
                    ctx.fillText("🌵", item.x + item.size / 2, item.y + item.size / 2); // Tikanlı (zərərli)
                } else {
                    ctx.fillText("🥒", item.x + item.size / 2, item.y + item.size / 2); // Dadlı xiyar
                }
            }
        }

        function loop() {
            update();
            draw();
            if (!isGameOver) {
                requestAnimationFrame(loop);
            }
        }

        // Oyunu başladırıq
        loop();
    </script>
</body>
</html>
